name: Instagram full archive

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Oldest date to include, YYYY-MM-DD (e.g. 2025-09-01)"
        required: false
        default: ""
      max_posts:
        description: "Max number of posts (0 = no limit)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "requests==2.32.3"

      - name: Download all posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SINCE: ${{ inputs.since }}
          MAX_POSTS: ${{ inputs.max_posts }}
        run: python ig_archive.py

      - name: Upload archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-archive
          path: archive/
          retention-days: 14
          compression-level: 0
